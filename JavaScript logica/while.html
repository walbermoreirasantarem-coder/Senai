let sair = "s";

while(sair.toLowerCase() === "s"){

    console.log("====== Calculadora ======");

    let n1 = prompt("Qual é o primeiro valor? ");
    n1 = parseInt(n1);

    console.log("Primeiro numero: " + n1);
 
    let operacao = prompt(" 1 - Soma \n 2 - Subtração \n 3 - Divisão \n 4 - Multiplicação");
    operacao = parseInt(operacao);

    let n2 = prompt("Qual é o segundo valor? ");
    n2 = parseInt(n2);

    console.log("Segundo numero: " + n2);

    if (operacao == 1 ){
        console.log("Resultado da soma: " + (n1 + n2));
    }


    else if (operacao == 2 ){
        console.log("Resultado da subtração: " + (n1 - n2));
    }

    else if (operacao == 3 ){
        console.log("Resultado da divisão: " + (n1 / n2));
    }

    else if (operacao == 4 ){
        console.log("Resultado da multiplicação: " + (n1 * n2));
    }

    else {
        console.log ("Opção não encontrada");
    }

    sair = prompt("deseja continuar? \n 'S'= sim 'N'= não");
}
